<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Planner</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="header">
    <h2>✈ Trip Planner</h2>
    <span id="modeToggle">🌙</span>
  </div>

  <div class="input-box">
    <input type="date" id="date">
    <input type="time" id="time">
    <input type="text" id="taskInput" placeholder="Task Description">
    <input type="text" id="location" placeholder="Location/Place">

    <select id="category">
      <option>Personal</option>
      <option>Travel</option>
      <option>Food</option>
    </select>

    <button onclick="addTask()">Add Task</button>
  </div>

  <div class="filters">
    <button class="active" onclick="setFilter('all', event)">All</button>
    <button onclick="setFilter('pending', event)">Pending</button>
    <button onclick="setFilter('completed', event)">Completed</button>
  </div>

  <div class="progress" id="progress">Progress: 0 / 0</div>

  <div id="taskList"></div>

</div>

<script src="script.js"></script>

</body>
</html>
